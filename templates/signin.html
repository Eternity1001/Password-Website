<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/signin.css') }}"
    >
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your account
            </p>

            <form method="POST">

                <div class="form-group">
                    <label for="username_or_email">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="username_or_email"
                        name="username_or_email"
                        placeholder="Username or email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >
                </div>

                <button type="submit">
                    Sign In
                </button>

            </form>

            <div class="forgot-links">

                <a href="{{ url_for('forgot_username') }}">
                    Forgot username?
                </a>

                <a href="{{ url_for('forgot_password') }}">
                    Forgot password?
                </a>

            </div>

            <div class="auth-footer">
                Don't have an account?
                <a href="/signup">Sign up</a>
            </div>

        </div>

    </div>

</body>
</html>
